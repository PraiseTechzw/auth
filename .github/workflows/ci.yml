name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
        working-directory: server
      - name: Lint
        run: npm run lint
        working-directory: server
      - name: Test
        run: npm test --silent
        working-directory: server

  otp-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
        working-directory: packages/otp-client
      - name: Test
        run: npm test --silent
        working-directory: packages/otp-client
